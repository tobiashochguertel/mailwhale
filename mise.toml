[tools]
go = "1.18"
node = "22"
"pipx:reuse" = "latest"

[tasks.setup]
description = "Initial setup — copy config, install webui dependencies"
run = [
    "cp -n config.default.yml config.yml || true",
    "cd webui && npm install --legacy-peer-deps",
]

[tasks.build]
description = "Full build — webui + Go binary"
depends = ["build-webui", "build-go"]

[tasks.build-webui]
description = "Build the Svelte frontend"
alias = "webui:build"
run = "cd webui && npm install --legacy-peer-deps && npm run build"

[tasks.build-go]
description = "Build the Go binary"
alias = "go:build"
run = "go build -o mailwhale ."

[tasks.dev-webui]
description = "Start webui in dev mode (rollup watch)"
alias = "webui:dev"
run = "cd webui && npm run dev"

[tasks.dev-server]
description = "Run the mailwhale server"
alias = "server:dev"
run = "./mailwhale"
depends = ["build-go"]

[tasks.clean]
description = "Remove build artifacts"
run = [
    "rm -f mailwhale",
    "rm -rf webui/public/build",
    "rm -rf webui/node_modules",
]

[tasks.test]
description = "Run tests (currently none — placeholder)"
run = "echo 'No tests configured yet'"

[tasks.lint]
description = "Lint the Go source"
run = "go vet ./..."

[tasks.lint-license]
description = "Check REUSE license compliance"
run = "reuse lint"

# ── Docker image tasks ───────────────────────────────────────────────────
# IMAGE_REGISTRY, IMAGE_NAME, IMAGE_TAG come from .env or default to private registry.
# Secrets are stored in .env (git-ignored). Override inline:
#   IMAGE_REGISTRY=ghcr.io mise run docker-publish

[env]
MISE_ENV_FILE = ".env"
IMAGE_REGISTRY = "docker.registry.hochguertel.work"
IMAGE_NAME = "mailwhale"
IMAGE_TAG = "latest"

[tasks.docker-build]
description = "Build container image"
alias = "image-build"
run = "docker build -t ${IMAGE_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG} ."

[tasks.docker-push]
description = "Push container image to remote registry"
alias = "image-push"
run = "docker push ${IMAGE_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

[tasks.docker-publish]
description = "Build and push container image"
alias = "image-publish"
depends = ["docker-build", "docker-push"]

[tasks.docker-tag]
description = "Tag image with additional tag (usage: TAG=stable mise run docker-tag)"
alias = "image-tag"
run = "docker tag ${IMAGE_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${TAG}"
